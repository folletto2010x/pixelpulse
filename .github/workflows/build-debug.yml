name: Build PixelPulse debug APK

# Manual run: GitHub -> Actions -> "Build PixelPulse debug APK" -> Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep the patch outside the working tree
        run: cp pixelpulse.patch /tmp/pixelpulse.patch

      - name: Check out the Pixel Music commit the patch was made against
        run: |
          git fetch origin 126dda5527d189aa6c7a0428e4081b2f5070942a || git fetch https://github.com/ianshulyadav/PixelMusicApp.git 126dda5527d189aa6c7a0428e4081b2f5070942a
          git checkout --detach 126dda5527d189aa6c7a0428e4081b2f5070942a

      - name: Apply the PixelPulse patch
        run: git apply --whitespace=nowarn /tmp/pixelpulse.patch

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          # pipefail (set by "shell: bash") makes a Gradle failure fail this step.
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show errors in the run summary
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '~~~'
            if [ -s build.log ]; then
              grep -nE '^e: |error:|FAILED|What went wrong|Could not|Exception|denied|No such' -A3 build.log | head -80
              echo '--- last lines ---'
              tail -n 25 build.log
            else
              echo "build.log is empty: the build step failed before Gradle printed anything."
            fi
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelPulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
