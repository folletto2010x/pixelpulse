name: Build PixelPulse debug APK

# Runs by hand (Actions -> Run workflow) and on every push that touches the patch files.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pixelpulse.patch"
      - "fixes/**"
      - ".github/workflows/build-debug.yml"

permissions:
  contents: write   # lets the last step publish the result to the ci-logs branch

concurrency:
  group: build-debug
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep the patches outside the working tree
        run: |
          mkdir -p /tmp/patches
          cp pixelpulse.patch /tmp/patches/0000-base.patch
          if [ -d fixes ]; then cp fixes/*.patch /tmp/patches/ 2>/dev/null || true; fi
          ls -la /tmp/patches

      - name: Check out the Pixel Music commit the patches were made against
        run: |
          git fetch origin 126dda5527d189aa6c7a0428e4081b2f5070942a || git fetch https://github.com/ianshulyadav/PixelMusicApp.git 126dda5527d189aa6c7a0428e4081b2f5070942a
          git checkout --detach 126dda5527d189aa6c7a0428e4081b2f5070942a

      - name: Apply the patches in order
        run: |
          for p in $(ls /tmp/patches/*.patch | sort); do
            echo "applying $p"
            git apply --whitespace=nowarn "$p"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          # pipefail (set by "shell: bash") makes a Gradle failure fail this step.
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show errors in the run summary
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '~~~'
            if [ -s build.log ]; then
              grep -nE '^e: |error:|FAILED|What went wrong|Could not|Execution failed' -A2 build.log | head -80
            else
              echo "build.log is empty: the build failed before Gradle printed anything."
            fi
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelPulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publishes a short report to the ci-logs branch so it can be read without opening Actions.
      - name: Publish result to the ci-logs branch
        if: always()
        run: |
          {
            echo "run: ${{ github.run_id }}"
            echo "source commit: ${{ github.sha }}"
            echo "result: ${{ job.status }}"
            echo "finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            if [ -s build.log ]; then
              echo "=== compiler / gradle errors ==="
              grep -nE '^e: |error:|FAILED|What went wrong|Could not|Execution failed' -A2 build.log | head -150
              echo
              echo "=== last 40 lines ==="
              tail -n 40 build.log
            else
              echo "build.log missing or empty (failed before Gradle)"
            fi
          } > /tmp/report.txt
          rm -rf /tmp/logs && mkdir /tmp/logs && cd /tmp/logs
          git init -q -b ci-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          cp /tmp/report.txt last-build.txt
          git add last-build.txt
          git commit -qm "build ${{ github.run_id }}: ${{ job.status }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
